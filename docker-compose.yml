services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: foodmatch
      POSTGRES_USER: foodmatch
      POSTGRES_PASSWORD: foodmatch_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "foodmatch", "-d", "foodmatch"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://foodmatch:foodmatch_dev@db:5432/foodmatch
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/model-cache

volumes:
  postgres_data:
  model_cache:

